name: Update Nodes V2Ray(v2ray)

on:
  schedule:
    # 每天 09:21、13:21、17:21、21:21 执行（北京时间）
    - cron: "21 1,5,9,13 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: 检查今日是否已更新
        id: check_status
        run: |
          # 获取格式为 YYYY-MM-DD 的当天日期
          BEIJING_DATE_FMT=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          LAST_COMMIT=$(git log -1 --format=%s || echo "none")
          
          # 检查最近一次提交信息里是否包含今天的日期 (YYYY-MM-DD)
          if [[ "$LAST_COMMIT" == *"$BEIJING_DATE_FMT"* ]] && [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "今天已经成功跑过任务（上次提交：$LAST_COMMIT），跳过本次。"
            echo "should_update=false" >> $GITHUB_ENV
          else
            echo "准备抓取今日节点。"
            echo "should_update=true" >> $GITHUB_ENV
          fi

      - name: 抓取最新节点
        if: env.should_update == 'true'
        run: |
          DATE_STR=$(TZ='Asia/Shanghai' date +'%Y%m%d')
          FILE_NAME="v${DATE_STR}"
          URL="https://github.com/free-nodes/v2rayfree/raw/refs/heads/main/${FILE_NAME}"
          
          echo "尝试抓取：$URL"
          
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          
          if curl -sSL -f -A "$UA" --retry 3 --connect-timeout 15 "$URL" -o nodev2ray.txt && [ $(stat -c%s nodev2ray.txt) -gt 512 ]; then
            echo "status=success" >> $GITHUB_ENV
            echo "节点抓取成功！"
          else
            echo "今日节点库尚未更新，跳过本次任务（不报错、不发邮件）。"
            echo "status=skip" >> $GITHUB_ENV
            exit 0
          fi

      - name: 提交更新
        if: env.should_update == 'true' && env.status == 'success'
        run: |
          NOW_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add nodev2ray.txt

          # 如果没有任何变化，则跳过提交
          if git diff --cached --quiet; then
            echo "今日节点内容无变化，跳过提交（不会报错，不会发邮件）。"
            exit 0
          fi

          # ⭐ 目录中显示的提交信息：保持干净的“更新于: 北京时间”
          git commit -m "更新于: ${NOW_TIME} [skip ci]"

          # ⭐ 先拉取远程最新变更防冲突
          git pull --rebase

          # ⭐ 推送
          git push
