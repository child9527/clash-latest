name: Full Cleanup (runs + artifacts + workflow history)

on:
  schedule:
    - cron: '0 0 1,16 * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Delete workflow runs (all workflows)
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}

          retain_days: 3
          keep_minimum_runs: 12

          delete_workflow_by_state: all
          delete_run_by_conclusion: all

          retry_count: 3
          retry_wait_seconds: 6

      - name: Delete all artifacts (via GitHub API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "开始清理所有 artifacts..."

          # 获取所有 artifacts
          artifacts=$(gh api repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[].id')

          if [ -z "$artifacts" ]; then
            echo "没有 artifacts 可清理。"
            exit 0
          fi

          for id in $artifacts; do
            echo "删除 artifact: $id"
            gh api \
              --method DELETE \
              repos/${{ github.repository }}/actions/artifacts/$id \
              || echo "删除失败（跳过）"
          done

          echo "所有 artifacts 清理完成。"

      - name: Delete workflow file history
        run: |
          echo "清理 workflow 文件历史版本（不会删除当前版本）"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch --prune --unshallow || true

          for wf in .github/workflows/*.yml; do
            echo "清理历史版本: $wf"
            git log --pretty=format:"%h" -- $wf | tail -n +2 | while read commit; do
              git rm --cached $wf || true
            done
          done

          git commit -m "清理 workflow 文件历史版本" || echo "没有可清理的 workflow 历史版本"
          git push || echo "没有可推送的内容"
